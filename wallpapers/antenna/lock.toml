# Radio dishes across the middle under orange clouds; darker sky top right.
# Look: clock Inter Display 700 96pt, accent #ffb454.
base = "right"

[background]
brightness = 0.75

[text]
color = "#fff1d6"
accent = "#ffb454"
font_family = "Inter Display"
font_weight = 700
halign = "right"
shadow_passes = 2
shadow_size = 5
shadow_color = "#e0120a04"

[clock]
font_family = "Inter Display"
font_weight = 700
font_size = 96
letter_spacing = -2
format = "HH:mm"
font_style = "normal"
color = "#fff1d6"
shadow_strength = 1.5
position = "-5%, 14%"

[date]
font_family = "Inter Display"
font_weight = 800
font_size = 14
letter_spacing = 6
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#ffb454"
opacity = 1
shadow_strength = 1.5
position = "-5%, 3.5%"

[greeting]
show = true
font_family = "Inter Display"
font_weight = 500
font_size = 15
letter_spacing = 0
text = "welcome back, {user}"
font_style = "normal"
uppercase = false
color = "#fff1d6"
opacity = 0.7
shadow_strength = 1.5
position = "-5%, -14%"

[input]
halign = "right"
position = "-5%, -22%"
size = [340, 58]
rounding = 29
inner_color = "#66190e05"
outer_color = "#66ffb454"
highlight_color = "#20ffd9a0"
accent_color = "#ffb454"
