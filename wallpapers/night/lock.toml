# Star trails on black; nothing to avoid.
# Default centred stack.
# Look: clock Inter Display 100 168pt, accent #8fa2cf.

[text]
color = "#c9d3e6"
accent = "#8fa2cf"
font_family = "Inter Display"
font_weight = 100
halign = "center"
shadow_passes = 0
shadow_size = 0
shadow_color = "#00000000"

[clock]
font_family = "Inter Display"
font_weight = 100
font_size = 168
letter_spacing = 0
format = "HH:mm"
font_style = "normal"
color = "#c9d3e6"
shadow_strength = 0
position = "0%, 18.4%"

[date]
font_family = "Inter Display"
font_weight = 300
font_size = 15
letter_spacing = 14
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#6f7fa0"
opacity = 1
shadow_strength = 0
position = "0%, 3.5%"

[greeting]
show = true
font_family = "Inter Display"
font_weight = 300
font_size = 14
letter_spacing = 2
text = "good {period}, {user}"
font_style = "normal"
uppercase = false
color = "#c9d3e6"
opacity = 0.5
shadow_strength = 0
position = "0%, -14%"

[input]
halign = "center"
position = "0%, -22%"
size = [300, 50]
rounding = 25
inner_color = "#22c9d3e6"
outer_color = "#40c9d3e6"
highlight_color = "#12ffffff"
accent_color = "#8fa2cf"
