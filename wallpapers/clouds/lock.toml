# Pastel pink clouds centre/right, moon top right, open lavender sky top left.
# Layout: Big airy clock in the open sky, the clouds swelling up over its end.

[depth]
foreground = "lock/fg-mask.png"

[background]
brightness = 1.0

[text]
color = "#2b2748"
accent = "#d6689b"
font_family = "Inter Display"
font_weight = 200
shadow_passes = 2
shadow_size = 3
shadow_color = "#88f5e0dc"

[clock]
font_family = "Inter Display"
font_weight = 200
letter_spacing = -4
format = "HH:mm"
font_style = "normal"
color = "#2b2748"
shadow_strength = 0.9
font_size = "26%"
halign = "left"
depth = "behind"
valign = "top"
position = "6%, -17%"

[date]
font_family = "Inter Display"
font_weight = 600
font_size = 14
letter_spacing = 7
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#6a4f86"
opacity = 0.95
shadow_strength = 0.9
halign = "left"
below = ""
above = "clock"
gap = 28

[greeting]
show = true
font_family = "Adwaita Sans"
font_weight = 300
font_size = 18
letter_spacing = 0
text = "good {period}, {user}"
font_style = "italic"
uppercase = false
color = "#3b3358"
opacity = 0.8
shadow_strength = 0.9
halign = "center"

[input]
size = [340, 58]
rounding = 29
inner_color = "#66f5e0dc"
outer_color = "#cc2b2748"
highlight_color = "#88ffffff"
accent_color = "#d6689b"
font_color = "#2b2748"
halign = "center"
valign = "bottom"
position = "0%, 7%"
