# Star trails on black; nothing to avoid.
# Layout: Nothing to avoid: one huge hairline clock dead centre, everything else small.

[text]
color = "#c9d3e6"
accent = "#8fa2cf"
font_family = "Inter Display"
font_weight = 100
shadow_passes = 0
shadow_size = 0
shadow_color = "#00000000"

[clock]
font_family = "Inter Display"
font_weight = 100
letter_spacing = -6
format = "HH:mm"
font_style = "normal"
color = "#c9d3e6"
shadow_strength = 0
font_size = "34%"
halign = "center"
valign = "top"
position = "0%, -22%"

[date]
font_family = "Inter Display"
font_weight = 300
font_size = 15
letter_spacing = 14
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#6f7fa0"
opacity = 1
shadow_strength = 0
halign = "center"
gap = 34

[greeting]
show = true
font_family = "Inter Display"
font_weight = 300
font_size = 14
letter_spacing = 2
text = "good {period}, {user}"
font_style = "normal"
uppercase = false
color = "#c9d3e6"
opacity = 0.5
shadow_strength = 0
halign = "center"

[input]
size = [300, 50]
rounding = 25
inner_color = "#22c9d3e6"
outer_color = "#40c9d3e6"
highlight_color = "#12ffffff"
accent_color = "#8fa2cf"
halign = "center"
valign = "bottom"
position = "0%, 8%"
