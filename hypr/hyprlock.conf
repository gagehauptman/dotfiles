# Positions are percentages of each monitor's viewport, so one set of widgets
# fits portrait and landscape. Rotated outputs report swapped axes, so DP-3 at
# transform 3 is 1080x1920. +y is up. Sizes stay in px.

$font = Noto Sans
$fg   = rgb(f2cdcd)
$bg   = rgb(1b1923)

background {
    monitor =
    # hyprlock covers and center-crops, and lock.png is centered art on a flat
    # field, so it survives any aspect. $bg matches that field.
    color = $bg
    path  = $HOME/.config/scripts/lock/lock.png
}

# greeting; message.sh carries its own weight span
label {
    monitor =
    text = cmd[update:60000] $HOME/.config/scripts/lock/message.sh
    color = $fg
    font_size = 25
    font_family = $font

    position = 0, -36%
    halign = center
    valign = center
}

# clock
label {
    monitor =
    text = <span weight='medium'><i>$TIME</i></span>
    color = $fg
    font_size = 25
    font_family = $font

    position = 0, 30%
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 200, 50
    position = 0, 0
    halign = center
    valign = center

    outline_thickness = 3
    outer_color = 0x00
    inner_color = 0x00
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    hide_input = false
    placeholder_text =
}
