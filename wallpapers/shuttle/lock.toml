# Glowing shuttle on the right; dark space on the left.
# Layout: Clock across the top, the shuttle's tail fin cutting into it.

[depth]
foreground = "lock/fg-mask.png"

[text]
color = "#ffe3d6"
accent = "#ff8a70"
font_family = "Inter Display"
font_weight = 300
shadow_passes = 2
shadow_size = 4
shadow_color = "#e0120810"

[clock]
font_family = "Inter Display"
font_weight = 300
letter_spacing = 0
format = "HH:mm"
font_style = "normal"
color = "#ffe3d6"
shadow_strength = 1.5
font_size = "21%"
halign = "center"
depth = "behind"
valign = "top"
position = "3%, -7%"

[date]
font_family = "Inter Display"
font_weight = 700
font_size = 13
letter_spacing = 5
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#ff8a70"
opacity = 1
shadow_strength = 1.5
halign = "right"
below = ""
above = "greeting"
gap = 34

[greeting]
show = true
font_family = "Inter Display"
font_weight = 400
font_size = 15
letter_spacing = 0
text = "good {period}, {user}"
font_style = "normal"
uppercase = false
color = "#ffe3d6"
opacity = 0.7
shadow_strength = 1.5
halign = "right"

[input]
size = [340, 58]
rounding = 29
inner_color = "#66120810"
outer_color = "#66ffe3d6"
highlight_color = "#20ffffff"
accent_color = "#ff8a70"
halign = "right"
valign = "bottom"
position = "-5%, 9%"
