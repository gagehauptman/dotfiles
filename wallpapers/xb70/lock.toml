# XB-70 crossing diagonally from top left to bottom right; open dark sky lower left.
# Sit lower, under the nose and clear of the wing.
# Look: clock Noto Sans Condensed 500 104pt, accent #ff6b5c.
base = "left"

[text]
color = "#eef3ff"
accent = "#ff6b5c"
font_family = "Noto Sans Condensed"
font_weight = 500
halign = "left"
shadow_passes = 2
shadow_size = 4
shadow_color = "#e0080c20"

[clock]
font_family = "Noto Sans Condensed"
font_weight = 500
font_size = 104
letter_spacing = 1
format = "HH:mm"
font_style = "normal"
color = "#eef3ff"
shadow_strength = 1.4
position = "5%, 12%"

[date]
font_family = "Noto Sans Condensed"
font_weight = 600
font_size = 14
letter_spacing = 7
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#ff6b5c"
opacity = 1
shadow_strength = 1.4
position = "5%, 1.5%"

[greeting]
show = true
font_family = "Noto Sans Condensed"
font_weight = 400
font_size = 17
letter_spacing = 0
text = "good {period}, {user}"
font_style = "normal"
uppercase = false
color = "#eef3ff"
opacity = 0.7
shadow_strength = 1.4
position = "5%, -16%"

[input]
halign = "left"
position = "5%, -24%"
size = [340, 58]
rounding = 29
inner_color = "#55080c20"
outer_color = "#66eef3ff"
highlight_color = "#20ffffff"
accent_color = "#ff6b5c"
