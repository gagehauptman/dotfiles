# Astronaut left of centre inside a red ring; planet limb lower right.
# The ring's lower-right arc crosses the default column; lift it clear.
# Look: clock Inter Display 100 130pt, accent #ff5c66.
base = "left"

[text]
color = "#e9f1ff"
accent = "#ff5c66"
font_family = "Inter Display"
font_weight = 100
halign = "left"
shadow_passes = 2
shadow_size = 4
shadow_color = "#cc050814"

[clock]
font_family = "Inter Display"
font_weight = 100
font_size = 130
letter_spacing = -2
format = "HH:mm"
font_style = "normal"
color = "#e9f1ff"
shadow_strength = 1.0
position = "5%, -12.5%"

[date]
font_family = "Inter Display"
font_weight = 400
font_size = 14
letter_spacing = 10
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#9fb8ff"
opacity = 0.95
shadow_strength = 1.0
position = "5%, -24.5%"

[greeting]
show = false
font_family = "Inter Display"
font_weight = 300
font_size = 15
letter_spacing = 2
text = "hello, {user}"
font_style = "normal"
uppercase = false
color = "#e9f1ff"
opacity = 0.6
shadow_strength = 1.0
position = "5%, -42%"

[input]
halign = "left"
position = "5%, -33.5%"
size = [300, 52]
rounding = 26
inner_color = "#40060a1a"
outer_color = "#55e9f1ff"
highlight_color = "#1cffffff"
accent_color = "#ff5c66"
