# Peace-sign hand, giant ball and car across the right half; palms and sky left.
# Layout: Heavy clock across the top, behind the mascot's spikes; the rest down the palm side.
# Look: clock Inter Display 800 120pt, accent #c99a00.

[depth]
foreground = "lock/fg-mask.png"

[background]
brightness = 0.95

[text]
color = "#14252d"
accent = "#c99a00"
font_family = "Inter Display"
font_weight = 800
shadow_passes = 2
shadow_size = 2
shadow_color = "#99ffffff"

[clock]
font_family = "Inter Display"
font_weight = 800
letter_spacing = -6
format = "h:mm"
font_style = "normal"
color = "#14252d"
shadow_strength = 1.0
font_size = "23%"
halign = "center"
depth = "behind"
valign = "top"
position = "14%, -5%"

[date]
font_family = "Inter Display"
font_weight = 700
font_size = 15
letter_spacing = 4
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#14252d"
opacity = 0.85
shadow_strength = 1.0
halign = "left"
below = ""
above = "greeting"
gap = 34

[greeting]
show = true
font_family = "Inter Display"
font_weight = 500
font_size = 18
letter_spacing = 0
text = "hey {user}"
font_style = "normal"
uppercase = false
color = "#14252d"
opacity = 0.8
shadow_strength = 1.0
halign = "left"

[input]
size = [340, 58]
rounding = 29
inner_color = "#66ffffff"
outer_color = "#9914252d"
highlight_color = "#88ffffff"
accent_color = "#c99a00"
font_color = "#14252d"
halign = "left"
valign = "bottom"
position = "5%, 9%"
