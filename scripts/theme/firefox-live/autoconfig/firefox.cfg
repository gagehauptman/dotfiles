// wallpaper theme (dotfiles scripts/theme/firefox-live): first line must stay a comment.
// On every start, loads <profile>/chrome/wallpaper-theme-extension (a symlink firefox.py makes to
// firefox-live/extension) as a temporary add-on, the same as about:debugging would. Release Firefox
// refuses unsigned add-ons otherwise, and temporary ones vanish when Firefox restarts.
// Profiles without that link are left alone.
try {
  const { AddonManager } = ChromeUtils.importESModule("resource://gre/modules/AddonManager.sys.mjs");
  const obs = Components.classes["@mozilla.org/observer-service;1"].getService(Components.interfaces.nsIObserverService);
  const dirs = Components.classes["@mozilla.org/file/directory_service;1"].getService(Components.interfaces.nsIProperties);
  const topic = "final-ui-startup";
  const observer = {
    observe() {
      obs.removeObserver(observer, topic);
      try {
        const ext = dirs.get("ProfD", Components.interfaces.nsIFile);
        ext.append("chrome");
        ext.append("wallpaper-theme-extension");
        if (!ext.exists()) return;
        ext.normalize();  // resolve the symlink
        AddonManager.installTemporaryAddon(ext).catch(e => Components.utils.reportError(e));
      } catch (e) { Components.utils.reportError(e); }
    },
  };
  obs.addObserver(observer, topic);
} catch (e) { Components.utils.reportError(e); }
