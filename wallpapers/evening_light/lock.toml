# Explosion glow right of centre behind a dark skyline; dark clouds top left.
# Layout: Dark clock rising behind the skyline against the explosion glow (sky mask).

[depth]
background = "lock/bg-mask.png"

[text]
color = "#f9dcbf"
accent = "#ff7a3d"
font_family = "Noto Sans"
font_weight = 200
shadow_passes = 2
shadow_size = 5
shadow_color = "#e0100603"

[clock]
font_family = "Noto Sans"
font_weight = 500
letter_spacing = -1
format = "HH:mm"
font_style = "normal"
color = "#1d1414"
shadow_strength = 0
font_size = "15%"
halign = "center"
depth = "far"
valign = "top"
position = "4%, -47%"

[date]
font_family = "Noto Sans"
font_weight = 600
font_size = 13
letter_spacing = 6
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#2a1a14"
opacity = 1
shadow_strength = 0
halign = "center"
below = ""
above = "clock"
gap = 26

[greeting]
show = true
font_family = "Noto Sans"
font_weight = 300
font_size = 17
letter_spacing = 0
text = "good {period}, {user}"
font_style = "italic"
uppercase = false
color = "#f9dcbf"
opacity = 0.75
shadow_strength = 1.6
halign = "center"

[input]
size = [340, 58]
rounding = 29
inner_color = "#5510070a"
outer_color = "#66f9dcbf"
highlight_color = "#1cffffff"
accent_color = "#ff7a3d"
halign = "center"
valign = "bottom"
position = "0%, 7%"
