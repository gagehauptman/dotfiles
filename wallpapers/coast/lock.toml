# Molten arc falling through the centre, moon upper left; dark on the right.
# Look: clock Adwaita Sans 700 88pt, accent #ff8a4c.
base = "right"

[text]
color = "#ffe0c2"
accent = "#ff8a4c"
font_family = "Adwaita Sans"
font_weight = 700
halign = "right"
shadow_passes = 2
shadow_size = 4
shadow_color = "#e0080310"

[clock]
font_family = "Adwaita Sans"
font_weight = 700
font_size = 88
letter_spacing = -2
format = "HH:mm"
font_style = "normal"
color = "#ffe0c2"
shadow_strength = 1.3
position = "-5%, 14%"

[date]
font_family = "Adwaita Sans"
font_weight = 500
font_size = 15
letter_spacing = 0
uppercase = false
format = "dddd d MMMM"
font_style = "normal"
color = "#ff8a4c"
opacity = 1
shadow_strength = 1.3
position = "-5%, 3.5%"

[greeting]
show = true
font_family = "Adwaita Sans"
font_weight = 400
font_size = 16
letter_spacing = 0
text = "good {period}, {user}"
font_style = "normal"
uppercase = false
color = "#ffe0c2"
opacity = 0.65
shadow_strength = 1.3
position = "-5%, -14%"

[input]
halign = "right"
position = "-5%, -22%"
size = [340, 58]
rounding = 29
inner_color = "#5a10070f"
outer_color = "#66ff8a4c"
highlight_color = "#1cffffff"
accent_color = "#ff8a4c"
