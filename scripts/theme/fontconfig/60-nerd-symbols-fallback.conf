<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Every font falls back to Symbols Nerd Font (ttf-nerd-fonts-symbols) for
     the Nerd Font icon codepoints, whatever family a wallpaper theme names.
     Qt only falls back to fonts fontconfig lists for the requested family, so
     without this, icons in a family like Inter Display or Noto Sans Mono draw
     as boxes. Linked into ~/.config/fontconfig/conf.d by install-fonts.sh. -->
<fontconfig>
  <match target="pattern">
    <edit name="family" mode="append_last"><string>Symbols Nerd Font</string></edit>
  </match>
</fontconfig>
