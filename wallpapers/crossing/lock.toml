# Pier house on the left, creature on the right, open water and fog in the middle.
# Layout: Centered over the open water between the pier house and the creature.

[depth]
foreground = "lock/fg-mask.png"

[text]
color = "#e3fff6"
accent = "#7fe0c8"
font_family = "Inter Display"
font_weight = 300
shadow_passes = 2
shadow_size = 4
shadow_color = "#e0031418"

[clock]
font_family = "Inter Display"
font_weight = 300
letter_spacing = 3
format = "HH:mm"
font_style = "normal"
color = "#e3fff6"
shadow_strength = 1.4
font_size = "20%"
halign = "center"
depth = "behind"
valign = "top"
position = "0%, -17%"

[date]
font_family = "Inter Display"
font_weight = 500
font_size = 14
letter_spacing = 8
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#8fe6cf"
opacity = 1
shadow_strength = 1.4
halign = "center"

[greeting]
show = true
font_family = "Noto Sans"
font_weight = 300
font_size = 12
letter_spacing = 6
text = "good {period}, {user}"
font_style = "normal"
uppercase = true
color = "#e3fff6"
opacity = 0.7
shadow_strength = 1.4
halign = "center"

[input]
size = [300, 52]
rounding = 26
inner_color = "#8005201f"
outer_color = "#998fe6cf"
highlight_color = "#20ffffff"
accent_color = "#7fe0c8"
halign = "center"
valign = "bottom"
position = "0%, 9%"
