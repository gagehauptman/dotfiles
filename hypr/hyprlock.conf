# Positions are percentages of each monitor's viewport, so one set of widgets
# fits portrait and landscape. Rotated outputs report swapped axes, so DP-3 at
# transform 3 is 1080x1920. +y is up. Sizes stay in px.

$font = Noto Sans
$fg   = rgb(f2cdcd)
$bg   = rgb(1b1923)

background {
    monitor =
    # hyprlock covers and center-crops, and lock.png is centered art on a flat
    # field, so it survives any aspect. $bg matches that field.
    color = $bg
}

# Layout: everything shares halign = center; y offsets are % of monitor height
# (+ is up), so spacing holds on 21:9, 16:9 and portrait.

# clock
label {
    monitor =
    text = cmd[update:1000] $HOME/.config/scripts/lock/clock.sh
    color = $fg
    font_size = 25
    font_family = $font

    position = 0, 20%
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $fg
    font_size = 15
    font_family = $font

    position = 0, 15.5%
    halign = center
    valign = center
}

# greeting; message.sh carries its own weight span
label {
    monitor =
    text = cmd[update:60000] $HOME/.config/scripts/lock/message.sh
    color = $fg
    font_size = 25
    font_family = $font

    position = 0, -22%
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 50
    position = 0, -32%
    halign = center
    valign = center

    outline_thickness = 2
    outer_color = rgba(f2cdcd66)
    inner_color = 0x00
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    hide_input = false
    placeholder_text =
}
