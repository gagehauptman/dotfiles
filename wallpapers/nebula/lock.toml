# Bright nebula left and centre; darker star field on the far right.
# Layout: Clock in the dark field on the right, the pink tendril curling over it.
# Look: clock Inter Display 500 90pt, accent #7fe8d0.

[depth]
foreground = "lock/fg-mask.png"

[text]
color = "#fff2f2"
accent = "#7fe8d0"
font_family = "Inter Display"
font_weight = 500
shadow_passes = 2
shadow_size = 5
shadow_color = "#e0100818"

[clock]
font_family = "Inter Display"
font_weight = 500
letter_spacing = 4
format = "HH:mm"
font_style = "normal"
color = "#fff2f2"
shadow_strength = 1.6
font_size = "17%"
halign = "right"
depth = "behind"
valign = "top"
position = "-5%, -30%"

[date]
font_family = "Adwaita Mono"
font_weight = 400
font_size = 13
letter_spacing = 5
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#7fe8d0"
opacity = 1
shadow_strength = 1.6
halign = "right"

[greeting]
show = true
font_family = "Inter Display"
font_weight = 300
font_size = 15
letter_spacing = 0
text = "good {period}, {user}"
font_style = "normal"
uppercase = false
color = "#fff2f2"
opacity = 0.7
shadow_strength = 1.6
halign = "right"

[input]
size = [340, 58]
rounding = 29
inner_color = "#5a100818"
outer_color = "#66fff2f2"
highlight_color = "#20ffffff"
accent_color = "#7fe8d0"
halign = "right"
valign = "bottom"
position = "-5%, 9%"
