# Astronaut on the left, capsule on the right, open horizon between them.
# Layout: Clock on the horizon between astronaut and capsule, just behind the capsule's edge.

[depth]
foreground = "lock/fg-mask.png"

[text]
color = "#d5e2ff"
accent = "#ff9b85"
font_family = "Carlito"
font_weight = 700
shadow_passes = 2
shadow_size = 4
shadow_color = "#e0060c1c"

[clock]
font_family = "Carlito"
font_weight = 700
letter_spacing = 2
format = "HH:mm"
font_style = "normal"
color = "#d5e2ff"
shadow_strength = 1.3
font_size = "19%"
halign = "center"
depth = "behind"
valign = "top"
position = "0%, -20%"

[date]
font_family = "Carlito"
font_weight = 400
font_size = 18
letter_spacing = 6
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#ff9b85"
opacity = 1
shadow_strength = 1.3
halign = "center"

[greeting]
show = true
font_family = "Carlito"
font_weight = 400
font_size = 19
letter_spacing = 0
text = "good {period}, {user}"
font_style = "italic"
uppercase = false
color = "#d5e2ff"
opacity = 0.8
shadow_strength = 1.3
halign = "center"

[input]
size = [320, 54]
rounding = 27
inner_color = "#55060c1c"
outer_color = "#66d5e2ff"
highlight_color = "#22ffffff"
accent_color = "#ff9b85"
halign = "center"
valign = "bottom"
position = "0%, 7%"
