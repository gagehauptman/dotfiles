# Molten arc falling through the centre, moon upper left; dark on the right.
# Layout: Bold clock with the molten arc slicing through it; field bottom right in the dark.
# Look: clock Adwaita Sans 700 88pt, accent #ff8a4c.

[depth]
foreground = "lock/fg-mask.png"

[text]
color = "#ffe0c2"
accent = "#ff8a4c"
font_family = "Adwaita Sans"
font_weight = 700
shadow_passes = 2
shadow_size = 4
shadow_color = "#e0080310"

[clock]
font_family = "Adwaita Sans"
font_weight = 700
letter_spacing = -2
format = "HH:mm"
font_style = "normal"
color = "#ffe0c2"
shadow_strength = 1.3
font_size = "22%"
halign = "center"
depth = "behind"
valign = "top"
position = "4%, -16%"

[date]
font_family = "Adwaita Sans"
font_weight = 500
font_size = 15
letter_spacing = 0
uppercase = false
format = "dddd d MMMM"
font_style = "normal"
color = "#ff8a4c"
opacity = 1
shadow_strength = 1.3
halign = "center"

[greeting]
show = true
font_family = "Adwaita Sans"
font_weight = 400
font_size = 16
letter_spacing = 0
text = "good {period}, {user}"
font_style = "normal"
uppercase = false
color = "#ffe0c2"
opacity = 0.65
shadow_strength = 1.3
halign = "right"

[input]
size = [340, 58]
rounding = 29
inner_color = "#5a10070f"
outer_color = "#66ff8a4c"
highlight_color = "#1cffffff"
accent_color = "#ff8a4c"
halign = "right"
valign = "bottom"
position = "-5%, 9%"
