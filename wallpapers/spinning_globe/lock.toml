# Live (Bevy): wireframe globe in the centre.
# Layout: Live scene: thin clock left, globe keeps the centre.
# Look: clock Noto Sans 100 116pt, accent #7fb4ff.

[text]
color = "#e8f0ff"
accent = "#7fb4ff"
font_family = "Noto Sans"
font_weight = 100
shadow_passes = 2
shadow_size = 3
shadow_color = "#88000000"

[clock]
font_family = "Noto Sans"
font_weight = 100
letter_spacing = 2
format = "HH:mm"
font_style = "normal"
color = "#e8f0ff"
shadow_strength = 0.6
font_size = "16%"
halign = "left"
valign = "top"
position = "5%, -14%"

[date]
font_family = "Noto Sans"
font_weight = 500
font_size = 13
letter_spacing = 4
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#7fb4ff"
opacity = 1
shadow_strength = 0.6
halign = "left"

[greeting]
show = true
font_family = "Noto Sans"
font_weight = 300
font_size = 15
letter_spacing = 0
text = "good {period}, {user}"
font_style = "normal"
uppercase = false
color = "#e8f0ff"
opacity = 0.65
shadow_strength = 0.6
halign = "left"

[input]
size = [340, 56]
rounding = 28
inner_color = "#22e8f0ff"
outer_color = "#557fb4ff"
highlight_color = "#10ffffff"
accent_color = "#7fb4ff"
halign = "left"
valign = "bottom"
position = "5%, 10%"
