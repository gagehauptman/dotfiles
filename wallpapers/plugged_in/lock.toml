# Figure at a charging post right of centre; dark night sky above the fence.
# Look: clock Noto Sans 300 104pt, accent #5fe0a8.
base = "left"

[text]
color = "#d5f2e6"
accent = "#5fe0a8"
font_family = "Noto Sans"
font_weight = 300
halign = "left"
shadow_passes = 2
shadow_size = 4
shadow_color = "#e0021610"

[clock]
font_family = "Noto Sans"
font_weight = 300
font_size = 104
letter_spacing = 1
format = "HH:mm"
font_style = "normal"
color = "#d5f2e6"
shadow_strength = 1.5
position = "5%, 14%"

[date]
font_family = "Noto Sans"
font_weight = 500
font_size = 13
letter_spacing = 5
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#5fe0a8"
opacity = 1
shadow_strength = 1.5
position = "5%, 3.5%"

[greeting]
show = true
font_family = "Noto Sans"
font_weight = 400
font_size = 15
letter_spacing = 0
text = "good {period}, {user}"
font_style = "normal"
uppercase = false
color = "#d5f2e6"
opacity = 0.7
shadow_strength = 1.5
position = "5%, -14%"

[input]
halign = "left"
position = "5%, -22%"
size = [340, 56]
rounding = 28
inner_color = "#55021610"
outer_color = "#66d5f2e6"
highlight_color = "#20ffffff"
accent_color = "#5fe0a8"
