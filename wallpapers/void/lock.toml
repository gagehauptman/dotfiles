# Outline figure lower left, planets across the top; empty on the right.
# Look: clock Adwaita Sans 200 110pt, accent #a9b7d9.
base = "right"

[text]
color = "#e3e7f2"
accent = "#a9b7d9"
font_family = "Adwaita Sans"
font_weight = 200
halign = "right"
shadow_passes = 2
shadow_size = 4
shadow_color = "#e0080a14"

[clock]
font_family = "Adwaita Sans"
font_weight = 200
font_size = 110
letter_spacing = -1
format = "h:mm"
font_style = "normal"
color = "#e3e7f2"
shadow_strength = 1.3
position = "-5%, 14%"

[date]
font_family = "Adwaita Sans"
font_weight = 500
font_size = 15
letter_spacing = 0
uppercase = false
format = "ddd d MMM"
font_style = "normal"
color = "#a9b7d9"
opacity = 1
shadow_strength = 1.3
position = "-5%, 3.5%"

[greeting]
show = true
font_family = "Adwaita Sans"
font_weight = 300
font_size = 16
letter_spacing = 0
text = "good {period}, {user}"
font_style = "italic"
uppercase = false
color = "#e3e7f2"
opacity = 0.7
shadow_strength = 1.3
position = "-5%, -14%"

[input]
halign = "right"
position = "-5%, -22%"
size = [320, 52]
rounding = 26
inner_color = "#40080a14"
outer_color = "#66e3e7f2"
highlight_color = "#1cffffff"
accent_color = "#a9b7d9"
