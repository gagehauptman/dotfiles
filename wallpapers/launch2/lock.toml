# Thin rocket climbing dead centre over a dark coast.
# Look: clock Adwaita Sans 200 118pt, accent #7fb0d8.
base = "left"

[text]
color = "#dfeaf5"
accent = "#7fb0d8"
font_family = "Adwaita Sans"
font_weight = 200
halign = "left"
shadow_passes = 2
shadow_size = 4
shadow_color = "#e0060c14"

[clock]
font_family = "Adwaita Sans"
font_weight = 200
font_size = 118
letter_spacing = 6
format = "HH mm"
font_style = "normal"
color = "#dfeaf5"
shadow_strength = 1.3
position = "5%, 14.6%"

[date]
font_family = "Adwaita Sans"
font_weight = 700
font_size = 14
letter_spacing = 8
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#a5cdee"
opacity = 1
shadow_strength = 1.3
position = "5%, 3.5%"

[greeting]
show = true
font_family = "Adwaita Sans"
font_weight = 400
font_size = 15
letter_spacing = 1
text = "good {period}, {user}"
font_style = "normal"
uppercase = false
color = "#dfeaf5"
opacity = 0.65
shadow_strength = 1.3
position = "5%, -14%"

[input]
halign = "left"
position = "5%, -22%"
size = [320, 52]
rounding = 26
inner_color = "#40060c14"
outer_color = "#55dfeaf5"
highlight_color = "#1cffffff"
accent_color = "#7fb0d8"
