# Moon and small boat on the centre line; dark sky and sea to both sides.
# Layout: Serif clock sitting on the moon, which rises in front of it; the rest over the sea.

[depth]
foreground = "lock/fg-mask.png"

[text]
color = "#dfe6f5"
accent = "#a9b8d8"
font_family = "Liberation Serif"
font_weight = 400
shadow_passes = 2
shadow_size = 4
shadow_color = "#e0040818"

[clock]
font_family = "Liberation Serif"
font_weight = 400
letter_spacing = 2
format = "HH:mm"
font_style = "normal"
color = "#dfe6f5"
shadow_strength = 1.4
halign = "center"
depth = "behind"
relative_to = "subject"
valign = "top"
position = "0, 10%"
font_size = "14%"

[date]
font_family = "Liberation Serif"
font_weight = 400
font_size = 13
letter_spacing = 9
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#a9b8d8"
opacity = 1
shadow_strength = 1.4
halign = "center"
below = ""
above = "clock"
gap = 26

[greeting]
show = true
font_family = "Liberation Serif"
font_weight = 400
font_size = 17
letter_spacing = 0
text = "good {period}, {user}"
font_style = "italic"
uppercase = false
color = "#dfe6f5"
opacity = 0.7
shadow_strength = 1.4
halign = "center"

[input]
size = [320, 52]
rounding = 26
inner_color = "#40040818"
outer_color = "#66dfe6f5"
highlight_color = "#1cffffff"
accent_color = "#a9b8d8"
halign = "center"
valign = "bottom"
position = "0%, 8%"
