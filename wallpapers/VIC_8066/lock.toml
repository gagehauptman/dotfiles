# Lighthouse silhouette at centre against a pale dusk sky.
# Layout: Big serif clock behind the lighthouse, which stands through the middle of it.

[depth]
foreground = "lock/fg-mask.png"

[background]
brightness = 0.62

[text]
color = "#f4e7d6"
accent = "#e8b7a8"
font_family = "Liberation Serif"
font_weight = 400
shadow_passes = 2
shadow_size = 4
shadow_color = "#dd1a1420"

[clock]
font_family = "Liberation Serif"
font_weight = 400
letter_spacing = 0
format = "h:mm"
font_style = "normal"
color = "#f4e7d6"
shadow_strength = 1.3
font_size = "25%"
halign = "center"
depth = "behind"
valign = "top"
position = "0%, -26%"

[date]
font_family = "Liberation Serif"
font_weight = 400
font_size = 20
letter_spacing = 1
uppercase = false
format = "dddd, MMMM d"
font_style = "italic"
color = "#e8b7a8"
opacity = 0.95
shadow_strength = 1.3
halign = "center"
below = ""
above = "clock"
gap = 26

[greeting]
show = true
font_family = "Liberation Serif"
font_weight = 400
font_size = 18
letter_spacing = 0
text = "good {period}, {user}"
font_style = "italic"
uppercase = false
color = "#f4e7d6"
opacity = 0.75
shadow_strength = 1.3
halign = "center"

[input]
size = [320, 54]
rounding = 27
inner_color = "#4d1a1420"
outer_color = "#66f4e7d6"
highlight_color = "#22ffffff"
accent_color = "#e8b7a8"
halign = "center"
valign = "bottom"
position = "0%, 7%"
