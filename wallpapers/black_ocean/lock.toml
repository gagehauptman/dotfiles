# Astronaut left of centre inside a red ring; planet limb lower right.
# Layout: Hairline clock over the dark planet, the red ribbon sweeping in front of it.

[depth]
foreground = "lock/fg-mask.png"

[text]
color = "#e9f1ff"
accent = "#ff5c66"
font_family = "Inter Display"
font_weight = 100
shadow_passes = 2
shadow_size = 4
shadow_color = "#cc050814"

[clock]
font_family = "Inter Display"
font_weight = 100
letter_spacing = -2
format = "HH:mm"
font_style = "normal"
color = "#e9f1ff"
shadow_strength = 1.0
font_size = "24%"
halign = "right"
depth = "behind"
valign = "top"
position = "-6%, -48%"

[date]
font_family = "Inter Display"
font_weight = 400
font_size = 14
letter_spacing = 10
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#9fb8ff"
opacity = 0.95
shadow_strength = 1.0
halign = "right"
gap = 30

[greeting]
show = false
font_family = "Inter Display"
font_weight = 300
font_size = 15
letter_spacing = 2
text = "hello, {user}"
font_style = "normal"
uppercase = false
color = "#e9f1ff"
opacity = 0.6
shadow_strength = 1.0
halign = "right"

[input]
size = [300, 52]
rounding = 26
inner_color = "#40060a1a"
outer_color = "#55e9f1ff"
highlight_color = "#1cffffff"
accent_color = "#ff5c66"
halign = "right"
valign = "bottom"
position = "-6%, 8%"
