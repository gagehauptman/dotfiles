# Giant drone mech on the left half; empty pale blue haze on the right.
# Layout: Mono clock in the haze on the right, tucked behind the mech's shoulder.

[depth]
foreground = "lock/fg-mask.png"

[background]
brightness = 0.7

[text]
color = "#e6f2ff"
accent = "#ff9a5c"
font_family = "Noto Sans Mono"
font_weight = 700
shadow_passes = 2
shadow_size = 4
shadow_color = "#e0071018"

[clock]
font_family = "Noto Sans Mono"
font_weight = 700
letter_spacing = 2
format = "HH:mm"
font_style = "normal"
color = "#e6f2ff"
shadow_strength = 1.5
font_size = "14%"
halign = "right"
depth = "behind"
valign = "top"
position = "-3%, -20%"

[date]
font_family = "Noto Sans Mono"
font_weight = 500
font_size = 13
letter_spacing = 3
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#ffb07a"
opacity = 1
shadow_strength = 1.5
halign = "right"

[greeting]
show = true
font_family = "Noto Sans Mono"
font_weight = 400
font_size = 13
letter_spacing = 0
text = "good {period}, {user}"
font_style = "normal"
uppercase = false
color = "#e6f2ff"
opacity = 0.7
shadow_strength = 1.5
halign = "right"

[input]
size = [320, 50]
rounding = 8
inner_color = "#66071620"
outer_color = "#66e6f2ff"
highlight_color = "#18ffffff"
accent_color = "#ff9a5c"
halign = "right"
valign = "bottom"
position = "-3%, 9%"
