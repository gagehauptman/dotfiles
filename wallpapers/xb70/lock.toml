# XB-70 crossing diagonally from top left to bottom right; open dark sky lower left.
# Layout: Clock in the open lower left, the XB-70's wing passing over its end.

[depth]
foreground = "lock/fg-mask.png"

[text]
color = "#eef3ff"
accent = "#ff6b5c"
font_family = "Noto Sans Condensed"
font_weight = 500
shadow_passes = 2
shadow_size = 4
shadow_color = "#e0080c20"

[clock]
font_family = "Noto Sans Condensed"
font_weight = 500
letter_spacing = 1
format = "HH:mm"
font_style = "normal"
color = "#eef3ff"
shadow_strength = 1.4
font_size = "19%"
halign = "left"
depth = "behind"
valign = "top"
position = "5%, -46%"

[date]
font_family = "Noto Sans Condensed"
font_weight = 600
font_size = 14
letter_spacing = 7
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#ff6b5c"
opacity = 1
shadow_strength = 1.4
halign = "left"

[greeting]
show = true
font_family = "Noto Sans Condensed"
font_weight = 400
font_size = 17
letter_spacing = 0
text = "good {period}, {user}"
font_style = "normal"
uppercase = false
color = "#eef3ff"
opacity = 0.7
shadow_strength = 1.4
halign = "left"

[input]
size = [340, 58]
rounding = 29
inner_color = "#55080c20"
outer_color = "#66eef3ff"
highlight_color = "#20ffffff"
accent_color = "#ff6b5c"
halign = "left"
valign = "bottom"
position = "5%, 8%"
