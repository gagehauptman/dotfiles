# Foggy lift bridge on the left two-thirds; dark teal fog on the right.
# Look: clock Carlito 400 128pt, accent #5fd1c8.
base = "right"

[text]
color = "#d3f3ef"
accent = "#5fd1c8"
font_family = "Carlito"
font_weight = 400
halign = "right"
shadow_passes = 2
shadow_size = 4
shadow_color = "#e0031012"

[clock]
font_family = "Carlito"
font_weight = 400
font_size = 128
letter_spacing = 1
format = "HH:mm"
font_style = "normal"
color = "#d3f3ef"
shadow_strength = 1.2
position = "-5%, 15.3%"

[date]
font_family = "Carlito"
font_weight = 700
font_size = 17
letter_spacing = 5
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#5fd1c8"
opacity = 1
shadow_strength = 1.2
position = "-5%, 3.5%"

[greeting]
show = true
font_family = "Carlito"
font_weight = 400
font_size = 20
letter_spacing = 0
text = "good {period}, {user}"
font_style = "italic"
uppercase = false
color = "#d3f3ef"
opacity = 0.7
shadow_strength = 1.2
position = "-5%, -14%"

[input]
halign = "right"
position = "-5%, -22%"
size = [340, 56]
rounding = 28
inner_color = "#55051a1d"
outer_color = "#5fd3f3ef"
highlight_color = "#20ffffff"
accent_color = "#5fd1c8"
