# Tree on the left, explosion in the middle; darker treeline lower right.
# Layout: Black-weight clock top right over the dark sky; field bottom right over the treeline.
# Look: clock Inter Display 900 100pt, accent #ffa640.

[background]
brightness = 0.75

[text]
color = "#fff0da"
accent = "#ffa640"
font_family = "Inter Display"
font_weight = 900
shadow_passes = 2
shadow_size = 5
shadow_color = "#e0180a02"

[clock]
font_family = "Inter Display"
font_weight = 900
letter_spacing = -3
format = "HH:mm"
font_style = "normal"
color = "#fff0da"
shadow_strength = 1.6
font_size = "15%"
halign = "right"
valign = "top"
position = "-5%, -11%"

[date]
font_family = "Inter Display"
font_weight = 800
font_size = 14
letter_spacing = 6
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#ffa640"
opacity = 1
shadow_strength = 1.6
halign = "right"

[greeting]
show = true
font_family = "Inter Display"
font_weight = 600
font_size = 15
letter_spacing = 0
text = "good {period}, {user}"
font_style = "normal"
uppercase = false
color = "#fff0da"
opacity = 0.75
shadow_strength = 1.6
halign = "right"

[input]
size = [340, 58]
rounding = 29
inner_color = "#66180a02"
outer_color = "#66fff0da"
highlight_color = "#20ffffff"
accent_color = "#ffa640"
halign = "right"
valign = "bottom"
position = "-5%, 9%"
