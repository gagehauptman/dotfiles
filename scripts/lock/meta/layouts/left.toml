# Everything in one left-aligned column near the left edge, for wallpapers
# whose subject is in the middle or on the right. Use with base = "left".

[text]
halign = "left"

[clock]
position = "5%, 14%"

[date]
position = "5%, 3.5%"

[greeting]
position = "5%, -14%"

[input]
halign = "left"
position = "5%, -22%"
