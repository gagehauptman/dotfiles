# Lighthouse silhouette at centre against a pale dusk sky.
# Look: clock Liberation Serif 400 118pt, accent #e8b7a8.
base = "left"

[background]
brightness = 0.62

[text]
color = "#f4e7d6"
accent = "#e8b7a8"
font_family = "Liberation Serif"
font_weight = 400
halign = "left"
shadow_passes = 2
shadow_size = 4
shadow_color = "#dd1a1420"

[clock]
font_family = "Liberation Serif"
font_weight = 400
font_size = 118
letter_spacing = 0
format = "h:mm"
font_style = "normal"
color = "#f4e7d6"
shadow_strength = 1.3
position = "5%, 14.6%"

[date]
font_family = "Liberation Serif"
font_weight = 400
font_size = 20
letter_spacing = 1
uppercase = false
format = "dddd, MMMM d"
font_style = "italic"
color = "#e8b7a8"
opacity = 0.95
shadow_strength = 1.3
position = "5%, 3.5%"

[greeting]
show = true
font_family = "Liberation Serif"
font_weight = 400
font_size = 18
letter_spacing = 0
text = "good {period}, {user}"
font_style = "italic"
uppercase = false
color = "#f4e7d6"
opacity = 0.75
shadow_strength = 1.3
position = "5%, -14%"

[input]
halign = "left"
position = "5%, -22%"
size = [320, 54]
rounding = 27
inner_color = "#4d1a1420"
outer_color = "#66f4e7d6"
highlight_color = "#22ffffff"
accent_color = "#e8b7a8"
