# Foggy station platform receding to the centre; dark sky upper left.
# Layout: Clock on the right with the platform lamp post standing in front of it.
# Look: clock Adwaita Sans 300 108pt, accent #c99be8.

[depth]
foreground = "lock/fg-mask.png"

[text]
color = "#f2dcf5"
accent = "#c99be8"
font_family = "Adwaita Sans"
font_weight = 300
shadow_passes = 2
shadow_size = 5
shadow_color = "#e0120a1a"

[clock]
font_family = "Adwaita Sans"
font_weight = 300
letter_spacing = 0
format = "HH:mm"
font_style = "italic"
color = "#f2dcf5"
shadow_strength = 1.5
font_size = "19%"
halign = "right"
depth = "behind"
valign = "top"
position = "-5%, -30%"

[date]
font_family = "Adwaita Sans"
font_weight = 500
font_size = 13
letter_spacing = 8
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#c99be8"
opacity = 1
shadow_strength = 1.5
halign = "right"

[greeting]
show = true
font_family = "Adwaita Sans"
font_weight = 300
font_size = 17
letter_spacing = 0
text = "good {period}, {user}"
font_style = "italic"
uppercase = false
color = "#f2dcf5"
opacity = 0.75
shadow_strength = 1.5
halign = "left"

[input]
size = [340, 58]
rounding = 29
inner_color = "#55120a1a"
outer_color = "#66f2dcf5"
highlight_color = "#20ffffff"
accent_color = "#c99be8"
halign = "left"
valign = "bottom"
position = "5%, 9%"
