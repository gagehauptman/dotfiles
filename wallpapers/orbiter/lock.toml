# Space station top centre over a bright cloud deck in the lower third.
# Look: clock Adwaita Sans 300 96pt, accent #9ab0ff.
base = "left"

[text]
color = "#f0f2ff"
accent = "#9ab0ff"
font_family = "Adwaita Sans"
font_weight = 300
halign = "left"
shadow_passes = 2
shadow_size = 4
shadow_color = "#e00a0c28"

[clock]
font_family = "Adwaita Sans"
font_weight = 300
font_size = 96
letter_spacing = 0
format = "HH:mm"
font_style = "normal"
color = "#f0f2ff"
shadow_strength = 1.4
position = "5%, 30%"

[date]
font_family = "Adwaita Sans"
font_weight = 600
font_size = 13
letter_spacing = 6
uppercase = true
format = "dddd, MMMM d"
font_style = "normal"
color = "#9ab0ff"
opacity = 1
shadow_strength = 1.4
position = "5%, 19.5%"

[greeting]
show = true
font_family = "Adwaita Sans"
font_weight = 400
font_size = 15
letter_spacing = 0
text = "good {period}, {user}"
font_style = "normal"
uppercase = false
color = "#f0f2ff"
opacity = 0.75
shadow_strength = 1.4
position = "5%, 2%"

[input]
halign = "left"
position = "5%, -6%"
size = [340, 58]
rounding = 29
inner_color = "#550a0c28"
outer_color = "#66f0f2ff"
highlight_color = "#20ffffff"
accent_color = "#9ab0ff"
